<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Quality Inspection</h1>
      <p>
        {{ isRegisterMode ? "Create your account" : "Sign in to continue" }}
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm">
      @if (isRegisterMode) {
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            [(ngModel)]="registerData.fullName"
            required
            placeholder="Enter your full name"
            [disabled]="loading"
          />
        </div>
      }

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          required
          minlength="3"
          placeholder="Enter username"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          minlength="4"
          placeholder="Enter password"
          [disabled]="loading"
        />
      </div>

      @if (error) {
        <div class="error-message">{{ error }}</div>
      }

      <button
        type="submit"
        class="btn-primary"
        [disabled]="loading || !authForm.valid"
      >
        @if (loading) {
          <span class="spinner"></span>
        } @else {
          {{ isRegisterMode ? "Create Account" : "Sign In" }}
        }
      </button>
    </form>

    <div class="login-footer">
      @if (isRegisterMode) {
        <p>Already have an account? <a (click)="toggleMode()">Sign in</a></p>
      } @else {
        <p>Don't have an account? <a (click)="toggleMode()">Create one</a></p>
      }
    </div>
  </div>
</div>
